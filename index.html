<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phần Mềm Luyện Nói Tiếng Trung HSK 2 - Hình Ảnh</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 550px;
            background: var(--card);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
            position: relative;
        }

        /* Header */
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .score-board {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-sub);
            background: #f1f5f9;
            padding: 6px 14px;
            border-radius: 20px;
        }

        .difficulty-select {
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid #cbd5e1;
            background: white;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
        }

        /* Thanh tiến trình */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }
        .progress-bar {
            flex-grow: 1;
            height: 8px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 5%;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 13px;
            font-weight: bold;
            color: var(--text-sub);
            min-width: 40px;
        }

        /* KHU VỰC HÌNH ẢNH MINH HỌA */
        .image-holder {
            width: 100%;
            height: 180px;
            border-radius: 16px;
            background-size: cover;
            background-position: center;
            margin-bottom: 20px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.1);
            transition: background-image 0.4s ease-in-out;
            border: 1px solid #e2e8f0;
        }

        /* Thẻ từ vựng */
        .word-card {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 20px;
            padding: 25px 20px;
            margin-bottom: 25px;
            position: relative;
            transition: all 0.3s ease;
        }

        ruby {
            font-size: 68px;
            font-weight: 700;
            color: #1e293b;
            ruby-position: over;
        }

        rt {
            font-size: 24px;
            color: #64748b;
            font-weight: 500;
            font-style: italic;
            padding-bottom: 12px;
            letter-spacing: 2px;
        }

        .meaning {
            font-size: 20px;
            color: #475569;
            margin-top: 10px;
            font-weight: 500;
        }

        .btn-audio {
            background: #e0f2fe;
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-audio:hover { background: #bae6fd; }
        .btn-audio svg { width: 20px; height: 20px; fill: #0284c7; }

        /* Vùng Micro */
        .speak-section {
            margin-bottom: 25px;
        }

        .btn-mic {
            background: var(--primary);
            color: white;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
            transition: all 0.2s ease;
            display: inline-flex;
            justify-content: center;
            align-items: center;
        }
        .btn-mic:hover {
            transform: scale(1.05);
            background: var(--primary-hover);
        }
        .btn-mic:disabled {
            background: #cbd5e1;
            box-shadow: none;
            cursor: not-allowed;
        }
        .btn-mic svg { width: 30px; height: 30px; fill: white; }

        .recording {
            background: var(--danger) !important;
            box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .status-text {
            font-size: 14px;
            font-weight: 500;
            color: #d97706;
            margin-top: 8px;
            height: 20px;
        }

        /* Kết quả */
        .result-box {
            padding: 15px;
            border-radius: 16px;
            display: none;
            margin-bottom: 25px;
            text-align: left;
            animation: slideUp 0.3s ease;
        }
        .result-title { font-weight: bold; font-size: 18px; margin-bottom: 5px; }
        .result-detail { font-size: 14px; color: #475569; }

        .correct { background: #f0fdf4; border: 2px solid var(--success); color: #166534; }
        .wrong { background: #fef2f2; border: 2px solid var(--danger); color: #991b1b; }

        /* Footer */
        .nav-footer {
            display: flex;
            justify-content: space-between;
            gap: 15px;
        }
        .btn-nav {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            background: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-nav:hover:not(:disabled) { background: #f1f5f9; }
        .btn-nav:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-next-active { background: var(--primary); color: white; border: none; }
        .btn-next-active:hover { background: var(--primary-hover); }

        .shake { animation: shakeAnimate 0.5s ease-in-out; }
        @keyframes shakeAnimate {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .bounce { animation: bounceAnimate 0.5s ease-in-out; }
        @keyframes bounceAnimate {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }
    </style>
</head>
<body>

<div class="app-container" id="app">
    <div class="app-header">
        <div class="score-board">Đạt: <span id="passed-count">0</span>/20</div>
        <select class="difficulty-select" id="diff-select">
            <option value="50">Chế độ: Dễ (>=50%)</option>
            <option value="70" selected>Chế độ: Vừa (>=70%)</option>
            <option value="85">Chế độ: Khó (>=85%)</option>
        </select>
    </div>

    <div class="progress-container">
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
        <div class="progress-text" id="progress-text">1/20</div>
    </div>

    <div class="image-holder" id="image-display"></div>

    <div class="word-card" id="word-card">
        <ruby id="ruby-display"></ruby>
        <div class="meaning" id="meaning"></div>
        <button class="btn-audio" id="btn-listen" title="Nghe phát âm mẫu">
            <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>
    </div>

    <div class="speak-section">
        <button class="btn-mic" id="btn-speak" title="Bấm để đọc">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
        </button>
        <div class="status-text" id="status"></div>
    </div>

    <div class="result-box" id="result-box">
        <div class="result-title" id="result-title">Chính xác: 0%</div>
        <div class="result-detail">Bạn đã phát âm: <span id="user-speech" style="font-weight: 600;">...</span></div>
    </div>

    <div class="nav-footer">
        <button class="btn-nav" id="btn-prev" disabled>Quay lại</button>
        <button class="btn-nav btn-next-active" id="btn-next">Từ tiếp theo 👉</button>
    </div>
</div>

<script>
    // Cấu trúc dữ liệu có bổ sung thêm URL hình ảnh (sử dụng ảnh Unsplash trực quan)
    const hsk2Words = [
        { hanzi: ["唱", "歌"], pinyin: ["chàng", "gē"], raw: "唱歌", meaning: "Hát", img: "https://images.unsplash.com/photo-1516280440614-37939bbacd6a?w=500&q=80" },
        { hanzi: ["跳", "舞"], pinyin: ["tiào", "wǔ"], raw: "跳舞", meaning: "Khiêu vũ / Nhảy", img: "https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=500&q=80" },
        { hanzi: ["跑", "步"], pinyin: ["pǎo", "bù"], raw: "跑步", meaning: "Chạy bộ", img: "https://images.unsplash.com/photo-1476480862126-209bfaa8edc8?w=500&q=80" },
        { hanzi: ["游", "泳"], pinyin: ["yóu", "yǒng"], raw: "游泳", meaning: "Bơi lội", img: "https://images.unsplash.com/photo-1530541930197-ff16ac917b0e?w=500&q=80" },
        { hanzi: ["便", "宜"], pinyin: ["pián", "yi"], raw: "便宜", meaning: "Rẻ", img: "https://images.unsplash.com/photo-1555529669-e69e7aa0ba9a?w=500&q=80" },
        { hanzi: ["说", "话"], pinyin: ["shuō", "huà"], raw: "说话", meaning: "Nói chuyện", img: "https://images.unsplash.com/photo-1522158673376-3c7379b3d75a?w=500&q=80" },
        { hanzi: ["准", "备"], pinyin: ["zhǔn", "bèi"], raw: "准备", meaning: "Chuẩn bị", img: "https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?w=500&q=80" },
        { hanzi: ["生", "病"], pinyin: ["shēng", "bìng"], raw: "生病", meaning: "Ốm / đổ bệnh", img: "https://images.unsplash.com/photo-1584515901367-f1c2a1268688?w=500&q=80" },
        { hanzi: ["休", "息"], pinyin: ["xiū", "xi"], raw: "休息", meaning: "Nghỉ ngơi", img: "https://images.unsplash.com/photo-1517594422361-5eeb8ae275a9?w=500&q=80" },
        { hanzi: ["服", "务", "员"], pinyin: ["fú", "wù", "yuán"], raw: "服务员", meaning: "Phục vụ viên", img: "https://images.unsplash.com/photo-1600565193348-f74bd3c7ccdf?w=500&q=80" },
        { hanzi: ["高", "兴"], pinyin: ["gāo", "xìng"], raw: "高兴", meaning: "Vui vẻ", img: "https://images.unsplash.com/photo-1516624683217-bf02fc6b6b7c?w=500&q=80" },
        { hanzi: ["时", "间"], pinyin: ["shí", "jiān"], raw: "时间", meaning: "Thời gian", img: "https://images.unsplash.com/photo-1508962914676-134849a727f0?w=500&q=80" },
        { hanzi: ["手", "表"], pinyin: ["shǒu", "biǎo"], raw: "手表", meaning: "Đồng hồ đeo tay", img: "https://images.unsplash.com/photo-1524805444758-089113d48a6d?w=500&q=80" },
        { hanzi: ["报", "纸"], pinyin: ["bào", "zhǐ"], raw: "报纸", meaning: "Báo chí", img: "https://images.unsplash.com/photo-1504711434969-e33886168f5c?w=500&q=80" },
        { hanzi: ["鸡", "蛋"], pinyin: ["jī", "dàn"], raw: "鸡蛋", meaning: "Trứng gà", img: "https://images.unsplash.com/photo-1587486913049-53fc88980cfc?w=500&q=80" },
        { hanzi: ["西", "瓜"], pinyin: ["xī", "guā"], raw: "西瓜", meaning: "Dưa hấu", img: "https://images.unsplash.com/photo-1589948184045-a1d49415c9c5?w=500&q=80" },
        { hanzi: ["咖", "啡"], pinyin: ["kā", "fēi"], raw: "咖啡", meaning: "Cà phê", img: "https://images.unsplash.com/photo-1509042239860-f550ce710b93?w=500&q=80" },
        { hanzi: ["自", "行", "车"], pinyin: ["zì", "xíng", "chē"], raw: "自行车", meaning: "Xe đạp", img: "https://images.unsplash.com/photo-1485965120184-e220f721d03e?w=500&q=80" },
        { hanzi: ["船"], pinyin: ["chuán"], raw: "船", meaning: "Thuyền / Tàu", img: "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=500&q=80" },
        { hanzi: ["晴"], pinyin: ["qíng"], raw: "晴", meaning: "Nắng / Trời quang", img: "https://images.unsplash.com/photo-1419242902214-272b3f66ee7a?w=500&q=80" }
    ];

    let currentIndex = 0;
    let passedWords = new Set();

    const rubyDisplay = document.getElementById('ruby-display');
    const meaningEl = document.getElementById('meaning');
    const progressFill = document.getElementById('progress');
    const progressText = document.getElementById('progress-text');
    const passedCountEl = document.getElementById('passed-count');
    const diffSelect = document.getElementById('diff-select');
    const wordCard = document.getElementById('word-card');
    const imageDisplay = document.getElementById('image-display');
    const statusEl = document.getElementById('status');
    const resultBox = document.getElementById('result-box');
    const resultTitle = document.getElementById('result-title');
    const userSpeechEl = document.getElementById('user-speech');
    
    const btnSpeak = document.getElementById('btn-speak');
    const btnListen = document.getElementById('btn-listen');
    const btnPrev = document.getElementById('btn-prev');
    const btnNext = document.getElementById('btn-next');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN';
        recognition.interimResults = false;
    } else {
        alert("Trình duyệt không hỗ trợ Nhận diện giọng nói. Hãy dùng Google Chrome!");
        btnSpeak.disabled = true;
    }

    // Phát âm thanh mẫu
    btnListen.addEventListener('click', () => {
        const textToSpeak = hsk2Words[currentIndex].raw;
        const utterance = new SpeechSynthesisUtterance(textToSpeak);
        utterance.lang = 'zh-CN';
        window.speechSynthesis.speak(utterance);
    });

    // Cập nhật giao diện toàn phần mềm
    function updateApp() {
        const currentData = hsk2Words[currentIndex];
        
        // 1. Cập nhật chữ Hán & Pinyin
        let rubyHTML = "";
        for (let i = 0; i < currentData.hanzi.length; i++) {
            rubyHTML += `${currentData.hanzi[i]}<rt>${currentData.pinyin[i]}</rt>`;
        }
        rubyDisplay.innerHTML = rubyHTML;
        meaningEl.innerText = currentData.meaning;

        // 2. CẬP NHẬT HÌNH ẢNH MỚI
        imageDisplay.style.backgroundImage = `url('${currentData.img}')`;

        // 3. Cập nhật tiến trình học
        const currentNum = currentIndex + 1;
        progressText.innerText = `${currentNum}/20`;
        progressFill.style.width = `${(currentNum / 20) * 100}%`;
        passedCountEl.innerText = passedWords.size;

        // Reset trạng thái báo Đúng/Sai câu cũ
        resultBox.style.display = 'none';
        wordCard.classList.remove('shake', 'bounce');
        statusEl.innerText = "";
        btnSpeak.classList.remove('recording');

        btnPrev.disabled = currentIndex === 0;
        btnNext.innerText = currentIndex === 19 ? "Kết thúc" : "Từ tiếp theo 👉";
    }

    // Thuật toán đo khớp ký tự chuỗi
    function similarity(s1, s2) {
        let longer = s1.toLowerCase(); let shorter = s2.toLowerCase();
        if (s1.length < s2.length) { longer = s2; shorter = s1; }
        let longerLength = longer.length;
        if (longerLength === 0) return 1.0;
        return (longerLength - editDistance(longer, shorter)) / parseFloat(longerLength);
    }
    function editDistance(s1, s2) {
        let costs = [];
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i == 0) costs[j] = j;
                else if (j > 0) {
                    let newValue = costs[j - 1];
                    if (s1.charAt(i - 1) != s2.charAt(j - 1))
                        newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                    costs[j - 1] = lastValue; lastValue = newValue;
                }
            }
            if (i > 0) costs[s2.length] = lastValue;
        }
        return costs[s2.length];
    }

    // Hiệu ứng tiếng Bíp báo hiệu kết quả
    function playSoundEffect(isSuccess) {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (isSuccess) {
            osc.frequency.setValueAtTime(587.33, ctx.currentTime);
            gain.gain.setValueAtTime(0.15, ctx.currentTime);
            osc.start(); osc.stop(ctx.currentTime + 0.12);
        } else {
            osc.frequency.setValueAtTime(220.00, ctx.currentTime);
            gain.gain.setValueAtTime(0.2, ctx.currentTime);
            osc.start(); osc.stop(ctx.currentTime + 0.25);
        }
    }

    // Ghi âm giọng nói
    btnSpeak.addEventListener('click', () => {
        if (!recognition) return;
        try {
            recognition.start();
            statusEl.innerText = "🔊 Đang ghi âm... Hãy nói ngay!";
            btnSpeak.classList.add('recording');
        } catch(e) {
            recognition.stop();
        }
    });

    if (recognition) {
        recognition.onresult = function(event) {
            btnSpeak.classList.remove('recording');
            statusEl.innerText = "";
            
            const speechResult = event.results[0][0].transcript;
            userSpeechEl.innerText = speechResult;

            const targetText = hsk2Words[currentIndex].raw;
            let matchScore = Math.round(similarity(speechResult, targetText) * 100);

            const passingScore = parseInt(diffSelect.value);
            resultBox.style.display = 'block';
            resultTitle.innerText = `Chính xác: ${matchScore}%`;
            
            wordCard.classList.remove('shake', 'bounce');

            if (matchScore >= passingScore) {
                resultBox.className = "result-box correct";
                wordCard.classList.add('bounce');
                passedWords.add(currentIndex);
                passedCountEl.innerText = passedWords.size;
                playSoundEffect(true);
            } else {
                resultBox.className = "result-box wrong";
                wordCard.classList.add('shake');
                playSoundEffect(false);
            }
        };

        recognition.onspeechend = function() {
            recognition.stop();
            btnSpeak.classList.remove('recording');
        };

        recognition.onerror = function() {
            statusEl.innerText = "❌ Lỗi micro hoặc chưa nghe rõ, hãy thử lại.";
            btnSpeak.classList.remove('recording');
        };
    }

    // Sự kiện nút chuyển từ
    btnNext.addEventListener('click', () => {
        if (currentIndex < 19) {
            currentIndex++;
            updateApp();
        } else {
            alert(`🎉 Bạn đã hoàn thành buổi học! \nKết quả đạt chuẩn: ${passedWords.size}/20 từ vựng.`);
            currentIndex = 0;
            passedWords.clear();
            updateApp();
        }
    });

    btnPrev.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            updateApp();
        }
    });

    // Chạy phần mềm
    updateApp();
</script>
</body>
</html>
