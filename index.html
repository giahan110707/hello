<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Nói Tiếng Trung HSK 2 - Bản Cải Tiến</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ec4b6;
            --danger: #e71d36;
            --dark: #2b2d42;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 6px;
            background: #eee;
            border-radius: 3px;
            margin-bottom: 20px;
        }

        .progress {
            height: 100%;
            background: var(--primary);
            width: 5%;
            transition: width 0.3s ease;
        }

        .word-card {
            margin: 25px 0;
        }

        .chinese-char {
            font-size: 64px;
            font-weight: bold;
            color: var(--dark);
            margin: 10px 0;
        }

        .pinyin {
            font-size: 26px;
            color: #2980b9;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .meaning {
            font-size: 18px;
            color: #7f8c8d;
            font-style: italic;
            margin-top: 5px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
            width: 100%;
            box-sizing: border-box;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4);
        }

        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-mic {
            background: #ff6b6b;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }
        .btn-mic:hover {
            background: #ee5253;
        }

        .listening-effect {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); box-shadow: 0 0 20px rgba(255, 107, 107, 0.6); }
            100% { transform: scale(1); }
        }

        .result-box {
            margin-top: 20px;
            min-height: 70px;
        }

        .score {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .user-speech {
            font-size: 15px;
            color: #7f8c8d;
        }

        /* Chế độ giả lập phòng hờ khi không có HTTPS */
        .fallback-zone {
            margin-top: 15px;
            padding: 15px;
            background: #f1f2f6;
            border-radius: 10px;
            border: 1px dashed #ced6e0;
        }
        .fallback-title {
            font-size: 13px;
            color: #57606f;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .btn-group-fallback {
            display: flex;
            gap: 10px;
        }
        .btn-test {
            padding: 8px 15px;
            font-size: 14px;
            border-radius: 5px;
            flex: 1;
        }
        .btn-good { background: #2ed573; }
        .btn-bad { background: #ff4757; }

        /* Lớp hiệu ứng Đúng / Sai phủ lên màn hình */
        .feedback {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            font-weight: bold;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .feedback.correct {
            background: rgba(46, 196, 182, 0.95);
            color: white;
            opacity: 1;
        }

        .feedback.wrong {
            background: rgba(231, 29, 54, 0.95);
            color: white;
            opacity: 1;
        }
        
        .feedback-sub {
            font-size: 20px;
            margin-top: 10px;
            font-weight: normal;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
        }
        
        .btn-nav {
            background: #f1f2f6;
            color: var(--dark);
            padding: 10px 15px;
            font-size: 14px;
            box-shadow: none;
        }
        .btn-nav:hover { background: #dfe4ea; transform: none; }
    </style>
</head>
<body>
<H1>Nguyễn Ngọc Gia Hân</H1>
    <div class="container">
        <div id="feedback-layer" class="feedback">✓</div>

        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>

        <div class="word-card">
            <div id="pinyin" class="pinyin">jīchǎng</div>
            <div id="character" class="chinese-char">机场</div>
            <div id="meaning" class="meaning">Sân bay</div>
        </div>

        <button id="mic-btn" class="btn btn-mic">🎙️ Bật Mic và Đọc Pinyin</button>

        <div class="result-box">
            <div id="score-text" class="score"></div>
            <div id="speech-text" class="user-speech"></div>
        </div>

        <div class="fallback-zone">
            <div class="fallback-title">⚠️ Nếu duyệt web không nhận mic (thiếu HTTPS), thử bằng 2 nút này:</div>
            <div class="btn-group-fallback">
                <button onclick="simulateResult(95)" class="btn btn-test btn-good">Giả lập Đọc Đúng (95%)</button>
                <button onclick="simulateResult(30)" class="btn btn-test btn-bad">Giả lập Đọc Sai (30%)</button>
            </div>
        </div>

        <div class="nav-buttons">
            <button id="prev-btn" class="btn btn-nav">◀ Từ trước</button>
            <button id="next-btn" class="btn btn-nav">Từ tiếp theo ▶</button>
        </div>
    </div>

<script>
    // 20 từ vựng HSK 2
    const hsk2Words = [
        { char: "机场", pinyin: "jīchǎng", mean: "Sân bay" },
        { char: "咖啡", pinyin: "kāfēi", mean: "Cà phê" },
        { char: "自行车", pinyin: "zìxíngchē", mean: "Xe đạp" },
        { char: "跑步", pinyin: "pǎobù", mean: "Chạy bộ" },
        { char: "房间", pinyin: "fángjiān", mean: "Phòng" },
        { char: "医院", pinyin: "yīyuàn", mean: "Bệnh viện" },
        { char: "牛奶", pinyin: "niúnǎi", mean: "Sữa bò" },
        { char: "鱼", pinyin: "yú", mean: "Cá" },
        { char: "便宜", pinyin: "piányi", mean: "Rẻ" },
        { char: "时间", pinyin: "shíjiān", mean: "Thời gian" },
        { char: "为什么", pinyin: "wèishénme", mean: "Tại sao" },
        { char: "报纸", pinyin: "bàozhǐ", mean: "Báo chí" },
        { char: "旅游", pinyin: "lǚyóu", mean: "Du lịch" },
        { char: "帮助", pinyin: "bāngzhù", mean: "Giúp đỡ" },
        { char: "公司", pinyin: "gōngsī", mean: "Công ty" },
        { char: "鸡蛋", pinyin: "jīdàn", mean: "Trứng gà" },
        { char: "西瓜", pinyin: "xīguā", mean: "Dưa hấu" },
        { char: "休息", pinyin: "xiūxi", mean: "Nghỉ ngơi" },
        { char: "说话", pinyin: "shuōhuà", mean: "Nói chuyện" },
        { char: "👋 再见", pinyin: "zàijiàn", mean: "Tạm biệt" }
    ];

    let currentIndex = 0;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN'; 
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
    }

    // DOM Elements
    const pinyinEl = document.getElementById('pinyin');
    const characterEl = document.getElementById('character');
    const meaningEl = document.getElementById('meaning');
    const micBtn = document.getElementById('mic-btn');
    const scoreText = document.getElementById('score-text');
    const speechText = document.getElementById('speech-text');
    const feedbackLayer = document.getElementById('feedback-layer');
    const progressBar = document.getElementById('progress');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    function updateWord() {
        const word = hsk2Words[currentIndex];
        characterEl.textContent = word.char;
        pinyinEl.textContent = word.pinyin;
        meaningEl.textContent = word.mean;
        progressBar.style.width = `${((currentIndex + 1) / hsk2Words.length) * 100}%`;
        scoreText.textContent = "";
        speechText.textContent = "";
    }

    // Thuật toán đo độ chính xác chuỗi kí tự
    function getSimilarity(s1, s2) {
        let longer = s1; let shorter = s2;
        if (s1.length < s2.length) { longer = s2; shorter = s1; }
        let longerLength = longer.length;
        if (longerLength === 0) return 100;
        return Math.round((longerLength - editDistance(longer, shorter)) / longerLength * 100);
    }

    function editDistance(s1, s2) {
        s1 = s1.toLowerCase(); s2 = s2.toLowerCase();
        let costs = [];
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i == 0) costs[j] = j;
                else {
                    if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) != s2.charAt(j - 1))
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue; lastValue = newValue;
                    }
                }
            }
            if (i > 0) costs[s2.length] = lastValue;
        }
        return costs[s2.length];
    }

    // Sự kiện Mic thực tế
    if (recognition) {
        micBtn.addEventListener('click', () => {
            try {
                recognition.start();
                micBtn.textContent = "🎙️ Đang nghe... Hãy nói!";
                micBtn.classList.add('listening-effect');
                micBtn.disabled = true;
            } catch (e) {
                alert("Không thể mở Mic. Hãy chắc chắn bạn cấp quyền Mic hoặc trang web đang chạy trên môi trường HTTPS an toàn.");
            }
        });

        recognition.onresult = function(event) {
            resetMicButton();
            const resultText = event.results[0][0].transcript;
            const cleanResult = resultText.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！]/g,"");
            const targetWord = hsk2Words[currentIndex].char;
            
            const score = getSimilarity(cleanResult, targetWord);
            
            speechText.textContent = `Hệ thống nghe được: "${cleanResult}"`;
            processScoreResult(score);
        };

        recognition.onspeechend = () => { resetMicButton(); recognition.stop(); };
        recognition.onerror = () => { resetMicButton(); alert("Lỗi nhận diện hoặc không nghe thấy gì. Hãy thử lại!"); };
    } else {
        micBtn.addEventListener('click', () => {
            alert("Trình duyệt này không hỗ trợ Speech API hoặc bạn đang mở file offline. Hãy dùng các nút Giả lập bên dưới để test hiệu ứng nhé!");
        });
    }

    function resetMicButton() {
        micBtn.textContent = "🎙️ Bật Mic và Đọc Pinyin";
        micBtn.classList.remove('listening-effect');
        micBtn.disabled = false;
    }

    // Hàm xử lý hiển thị điểm số & hiệu ứng
    function processScoreResult(score) {
        scoreText.textContent = `Độ chính xác: ${score}%`;
        if (score >= 60) {
            scoreText.style.color = "var(--success)";
            showFeedback(true, score);
        } else {
            scoreText.style.color = "var(--danger)";
            showFeedback(false, score);
        }
    }

    // Hàm kích hoạt hiệu ứng flash Đúng/Sai
    function showFeedback(isCorrect, score) {
        if (isCorrect) {
            feedbackLayer.innerHTML = `✓ Chính xác!<div class="feedback-sub">Đạt ${score}% - Tự chuyển từ mới</div>`;
            feedbackLayer.className = "feedback correct";
        } else {
            feedbackLayer.innerHTML = `✗ Chưa đúng!<div class="feedback-sub">Chỉ đạt ${score}% - Hãy thử lại</div>`;
            feedbackLayer.className = "feedback wrong";
        }

        setTimeout(() => {
            feedbackLayer.className = "feedback";
            if (isCorrect) {
                if (currentIndex < hsk2Words.length - 1) {
                    currentIndex++;
                    updateWord();
                } else {
                    alert("🎉 Xuất sắc! Bạn đã hoàn thành toàn bộ 20 từ vựng HSK 2!");
                    currentIndex = 0;
                    updateWord();
                }
            }
        }, 1500);
    }

    // Hàm bổ sung: Giả lập kết quả (Cứu cánh khi môi trường chặn Mic)
    function simulateResult(mockScore) {
        speechText.textContent = mockScore >= 60 ? `[Giả lập] Bạn đọc chuẩn từ: ${hsk2Words[currentIndex].char}` : `[Giả lập] Bạn đọc sai từ này`;
        processScoreResult(mockScore);
    }

    // Điều hướng tiến lùi từ vựng
    nextBtn.addEventListener('click', () => {
        if (currentIndex < hsk2Words.length - 1) { currentIndex++; updateWord(); }
    });
    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) { currentIndex--; updateWord(); }
    });

    // Khởi chạy
    updateWord();
</script>

</body>
</html>
