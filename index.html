<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luyện Nói Tiếng Trung HSK 2</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ec4b6;
            --danger: #e71d36;
            --dark: #2b2d42;
            --light: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e0eafc, #cfdef3);
            color: var(--dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .progress-bar {
            height: 6px;
            background: #eee;
            border-radius: 3px;
            margin-bottom: 20px;
        }

        .progress {
            height: 100%;
            background: var(--primary);
            width: 5%;
            transition: width 0.3s ease;
        }

        .word-card {
            margin: 30px 0;
            transition: transform 0.3s;
        }

        .chinese-char {
            font-size: 72px;
            font-weight: bold;
            color: var(--dark);
            margin: 10px 0;
        }

        .pinyin {
            font-size: 24px;
            color: #7f8c8d;
            font-weight: 500;
        }

        .meaning {
            font-size: 18px;
            color: #95a5a6;
            font-style: italic;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
            outline: none;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4);
        }

        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-mic {
            background: #ff6b6b;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.3);
        }
        .btn-mic:hover {
            background: #ee5253;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.4);
        }

        .listening-effect {
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 107, 107, 0.6); }
            100% { transform: scale(1); }
        }

        .result-box {
            margin-top: 25px;
            min-height: 80px;
        }

        .score {
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .user-speech {
            font-size: 16px;
            color: #7f8c8d;
        }

        /* Hiệu ứng Đúng/Sai */
        .feedback {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 80px;
            font-weight: bold;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s ease;
        }

        .feedback.correct {
            background: rgba(46, 196, 182, 0.9);
            color: white;
            opacity: 1;
        }

        .feedback.wrong {
            background: rgba(231, 29, 54, 0.9);
            color: white;
            opacity: 1;
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        
        .btn-nav {
            background: #ecf0f1;
            color: var(--dark);
            padding: 10px 20px;
            font-size: 14px;
        }
        .btn-nav:hover { background: #e2e8f0; }
    </style>
</head>
<body>

    <div class="container">
        <div id="feedback-layer" class="feedback">✓</div>

        <div class="progress-bar">
            <div id="progress" class="progress"></div>
        </div>

        <div class="word-card">
            <div id="pinyin" class="pinyin">bàba</div>
            <div id="character" class="chinese-char">爸爸</div>
            <div id="meaning" class="meaning">Bố, cha</div>
        </div>

        <button id="mic-btn" class="btn btn-mic">Bật Mic và Nói</button>

        <div class="result-box">
            <div id="score-text" class="score"></div>
            <div id="speech-text" class="user-speech"></div>
        </div>

        <div class="nav-buttons">
            <button id="prev-btn" class="btn btn-nav">Trước đó</button>
            <button id="next-btn" class="btn btn-nav">Bỏ qua / Tiếp</button>
        </div>
    </div>

<script>
    // Danh sách 20 từ vựng HSK 2 tiêu biểu (gồm Chữ hán, Pinyin không dấu để so sánh, Pinyin hiển thị và Nghĩa)
    const hsk2Words = [
        { char: "🚝 机场", pinyinDisplay: "jīchǎng", match: "机场", mean: "Sân bay" },
        { char: "☕ 咖啡", pinyinDisplay: "kāfēi", match: "咖啡", mean: "Cà phê" },
        { char: "🚲 自行车", pinyinDisplay: "zìxíngchē", match: "自行车", mean: "Xe đạp" },
        { char: "🏃 跑步", pinyinDisplay: "pǎobù", match: "跑步", mean: "Chạy bộ" },
        { char: "🔢 件", pinyinDisplay: "jiàn", match: "件", mean: "Lượng từ (quần áo, sự việc)" },
        { char: "🛏️ 房间", pinyinDisplay: "fángjiān", match: "房间", mean: "Phòng" },
        { char: "👨‍🏫 老师", pinyinDisplay: "lǎoshī", match: "老师", mean: "Thầy cô giáo" },
        { char: "🏥 医院", pinyinDisplay: "yīyuàn", match: "医院", mean: "Bệnh viện" },
        { char: "🥛 牛奶", pinyinDisplay: "niúnǎi", match: "牛奶", mean: "Sữa bò" },
        { char: "🐟 鱼", pinyinDisplay: "yú", match: "鱼", mean: "Cá" },
        { char: "🧪 便宜", pinyinDisplay: "piányi", match: "便宜", mean: "Rẻ" },
        { char: "⏰ 时间", pinyinDisplay: "shíjiān", match: "时间", mean: "Thời gian" },
        { char: "❓ 为什么", pinyinDisplay: "wèishénme", match: "为什么", mean: "Tại sao" },
        { char: "📰 报纸", pinyinDisplay: "bàozhǐ", match: "报纸", mean: "Báo chí" },
        { char: "🚶 旅游", pinyinDisplay: "lǚyóu", match: "旅游", mean: "Du lịch" },
        { char: "🤝 帮助", pinyinDisplay: "bāngzhù", match: "帮助", mean: "Giúp đỡ" },
        { char: "🏢 公司", pinyinDisplay: "gōngsī", match: "公司", mean: "Công ty" },
        { char: "🥚 鸡蛋", pinyinDisplay: "jīdàn", match: "鸡蛋", mean: "Trứng gà" },
        { char: "🍉 西瓜", pinyinDisplay: "xīguā", match: "西瓜", mean: "Dưa hấu" },
        { char: "🛌 休息", pinyinDisplay: "xiūxi", match: "休息", mean: "Nghỉ ngơi" }
    ];

    let currentIndex = 0;
    
    // Khởi tạo Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;
    
    if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = 'zh-CN'; // Nhận diện tiếng Trung chuẩn (Mandarin)
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
    } else {
        alert("Trình duyệt của bạn không hỗ trợ nhận diện giọng nói. Hãy dùng Google Chrome hoặc MS Edge!");
    }

    // DOM Elements
    const pinyinEl = document.getElementById('pinyin');
    const characterEl = document.getElementById('character');
    const meaningEl = document.getElementById('meaning');
    const micBtn = document.getElementById('mic-btn');
    const scoreText = document.getElementById('score-text');
    const speechText = document.getElementById('speech-text');
    const feedbackLayer = document.getElementById('feedback-layer');
    const progressBar = document.getElementById('progress');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Hiển thị từ vựng hiện tại
    function updateWord() {
        const word = hsk2Words[currentIndex];
        characterEl.textContent = word.char;
        pinyinEl.textContent = word.pinyinDisplay;
        meaningEl.textContent = word.mean;
        
        // Cập nhật thanh tiến trình
        progressBar.style.width = `${((currentIndex + 1) / hsk2Words.length) * 100}%`;
        
        // Reset text chấm điểm
        scoreText.textContent = "";
        speechText.textContent = "";
    }

    // Thuật toán Levenshtein tính độ tương đồng của chuỗi (Chấm điểm %)
    function getSimilarity(s1, s2) {
        let longer = s1;
        let shorter = s2;
        if (s1.length < s2.length) {
            longer = s2;
            shorter = s1;
        }
        let longerLength = longer.length;
        if (longerLength === 0) {
            return 100;
        }
        return Math.round((longerLength - editDistance(longer, shorter)) / longerLength * 100);
    }

    function editDistance(s1, s2) {
        s1 = s1.toLowerCase();
        s2 = s2.toLowerCase();
        let costs = new Array();
        for (let i = 0; i <= s1.length; i++) {
            let lastValue = i;
            for (let j = 0; j <= s2.length; j++) {
                if (i == 0)
                    costs[j] = j;
                else {
                    if (j > 0) {
                        let newValue = costs[j - 1];
                        if (s1.charAt(i - 1) != s2.charAt(j - 1))
                            newValue = Math.min(Math.min(newValue, lastValue), costs[j]) + 1;
                        costs[j - 1] = lastValue;
                        lastValue = newValue;
                    }
                }
            }
            if (i > 0) costs[s2.length] = lastValue;
        }
        return costs[s2.length];
    }

    // Sự kiện Click Mic
    micBtn.addEventListener('click', () => {
        if (!recognition) return;
        recognition.start();
        micBtn.textContent = "Đang nghe... Nói đi bạn!";
        micBtn.classList.add('listening-effect');
        micBtn.disabled = true;
    });

    // Xử lý khi nhận diện xong giọng nói
    recognition.onresult = function(event) {
        micBtn.textContent = "Bật Mic và Nói";
        micBtn.classList.remove('listening-effect');
        micBtn.disabled = false;

        // Lấy kết quả chữ Hán hệ thống nghe được
        const resultText = event.results[0][0].transcript;
        // Loại bỏ các dấu câu nếu có
        const cleanResult = resultText.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()？。，！]/g,"");
        
        const targetWord = hsk2Words[currentIndex].match;
        
        // Tính điểm phần trăm chính xác dựa trên chữ Hán nhận diện được
        const score = getSimilarity(cleanResult, targetWord);

        speechText.textContent = `Bạn đã nói: "${cleanResult}"`;
        scoreText.textContent = `Độ chính xác: ${score}%`;

        // Định hình hiệu ứng Đúng (>60%) hoặc Sai
        if (score >= 60) {
            scoreText.style.color = "var(--success)";
            showFeedback(true);
        } else {
            scoreText.style.color = "var(--danger)";
            showFeedback(false);
        }
    };

    // Xử lý lỗi hoặc khi người dùng không nói gì
    recognition.onspeechend = function() {
        recognition.stop();
        micBtn.textContent = "Bật Mic và Nói";
        micBtn.classList.remove('listening-effect');
        micBtn.disabled = false;
    };

    recognition.onerror = function(event) {
        micBtn.textContent = "Bật Mic và Nói";
        micBtn.classList.remove('listening-effect');
        micBtn.disabled = false;
        alert("Không nhận diện được giọng nói, vui lòng thử lại!");
    };

    // Hiển thị hiệu ứng Flash Đúng/Sai nhấp nháy toàn màn hình thẻ
    function showFeedback(isCorrect) {
        if (isCorrect) {
            feedbackLayer.textContent = "✓ Đúng rồi!";
            feedbackLayer.className = "feedback correct";
        } else {
            feedbackLayer.textContent = "✗ Thử lại xem!";
            feedbackLayer.className = "feedback wrong";
        }

        // Tự động ẩn hiệu ứng sau 1.2 giây và tự động qua từ mới nếu đúng
        setTimeout(() => {
            feedbackLayer.className = "feedback";
            if (isCorrect && currentIndex < hsk2Words.length - 1) {
                currentIndex++;
                updateWord();
            }
        }, 1200);
    }

    // Điều hướng các nút bấm
    nextBtn.addEventListener('click', () => {
        if (currentIndex < hsk2Words.length - 1) {
            currentIndex++;
            updateWord();
        } else {
            alert("Chúc mừng! Bạn đã hoàn thành hết 20 từ vựng HSK 2.");
        }
    });

    prevBtn.addEventListener('click', () => {
        if (currentIndex > 0) {
            currentIndex--;
            updateWord();
        }
    });

    // Khởi chạy ứng dụng lần đầu
    updateWord();
</script>

</body>
</html>
