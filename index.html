<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Học Tiếng Trung HSK 2 - Cải Tiến</title>
    <style>
        :root {
            --primary: #4a90e2;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #2c3e50;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 20px;
            color: var(--primary);
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #eee;
            border-radius: 4px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress {
            height: 100%;
            background: var(--primary);
            width: 5%;
            transition: width 0.3s ease;
        }

        .word-card {
            margin: 40px 0;
            min-height: 160px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* Phong cách hiển thị Ruby (Chữ Hán + Pinyin trên đầu) */
        ruby {
            font-size: 64px;
            font-weight: bold;
            color: #333;
            ruby-position: over;
            display: inline-block;
            margin-bottom: 15px;
        }

        rt {
            font-size: 22px;
            color: #7f8c8d;
            font-weight: normal;
            font-style: italic;
            padding-bottom: 8px;
            letter-spacing: 2px;
        }

        .meaning {
            font-size: 22px;
            color: var(--primary);
            font-weight: 600;
            margin-top: 10px;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(74, 144, 226, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 144, 226, 0.4);
        }

        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-mic {
            background: #e67e22;
            box-shadow: 0 5px 15px rgba(230, 126, 34, 0.3);
        }
        .btn-mic:hover {
            background: #d35400;
            box-shadow: 0 8px 20px rgba(230, 126, 34, 0.4);
        }

        .recording-status {
            margin-top: 15px;
            font-weight: bold;
            height: 24px;
            color: #e67e22;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            display: none;
            animation: slideUp 0.4s ease;
        }

        .score {
            font-size: 22px;
            font-weight: bold;
        }

        .correct {
            background: rgba(46, 204, 113, 0.15);
            border: 2px solid var(--success);
            color: var(--success);
        }

        .wrong {
            background: rgba(231, 76, 60, 0.15);
            border: 2px solid var(--danger);
            color: var(--danger);
        }

        .nav-buttons {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .shake { animation: shake 0.5s ease-in-out; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }
